version: "3"

services:
  waitfordb:
    image: dadarek/wait-for-dependencies
    depends_on:
      - mysql
    command: mysql:3306

  mlflow-server:
    build: ./mlflow
    depends_on:
      - mysql
      - minio
      - waitfordb
      - waitforminio
    command: ["bash", "./run_server.sh"]
    ports:
      - "${MLFLOW_SERVER_PORT}:5000"
    env_file: .env
    restart: always

  mysql:
    image: mysql:8.0
    environment:
      TZ: "Asia/Tokyo"
      MYSQL_DATABASE: "mlflow"
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d
    restart: always

volumes:
  mysql:
