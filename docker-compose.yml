version: '3'

services:
  waitfordb:
    image: dadarek/wait-for-dependencies
    depends_on:
      - mysql
    command: mysql:3306

  waitforminio:
    image: dadarek/wait-for-dependencies
    depends_on:
      - minio
    command: minio:${MINIO_PORT}

  waitformlflowd:
    image: dadarek/wait-for-dependencies
    depends_on:
      - mlflow-deployment
    command: mlflow-deployment:5001

  mlflow-deployment:
    build: ./mlflow
    depends_on:
      - mysql
      - minio
      - waitfordb
      - waitforminio
    command: ["bash", "./run_deployment.sh"]
    ports:
      - "${MLFLOW_DEPLOYMENT_PORT}:5001"
    env_file: .env
    restart: always

  mlflow-server:
    build: ./mlflow
    depends_on:
      - mysql
      - minio
      - mlflow-deployment
      - waitfordb
      - waitforminio
      - waitformlflowd
    command: ["bash", "./run_server.sh"]
    ports:
      - "${MLFLOW_SERVER_PORT}:5000"
    environment:
      - MLFLOW_DEPLOYMENTS_TARGET=http://mlflow-deployment:5001
    env_file: .env
    restart: always

  mysql:
    image: mysql:8.0
    environment:
      TZ: "Asia/Tokyo"
      MYSQL_DATABASE: "mlflow"
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d
    restart: always

  minio:
    image: minio/minio
    environment:
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"
    command:
      - "server"
      - "--address"
      - "${MINIO_HOST}:80"
      - "/data"
    ports:
      - "${MINIO_PORT}:80"
    volumes:
      - minio:/data
    restart: always

volumes:
    mysql:
    minio:
